<title id="t">Shared or private memory: the same four agents</title>
<desc id="d">ScaleMAS (FAIR/Meta, Harvard, 12 October 2026): successful answers on BrowseComp-Plus, Table 2: a shared store 55.1%; a private store each 46.8%; no store 38.0%. Equal team size (four Qwen3.5-9B agents), not equal compute. The earlier ablation (Scaling Teams or Time) found the opposite: private memory slightly better, 49.43 versus 48.62. Supplement of 19 October 2026.</desc>
